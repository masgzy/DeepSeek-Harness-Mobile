# 代码质量门禁：脚本静态检查 + Android 构建验证
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell 脚本检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck -S error \
            scripts/fetch-proot.sh \
            scripts/gen-release-notes.sh \
            runtime/build-rootfs.sh \
            app/src/main/assets/scripts/bootstrap.sh \
            app/src/main/assets/scripts/pnpm-install.sh \
            app/src/main/assets/scripts/mirror-apply.sh
      - name: bash 语法检查
        run: |
          for f in scripts/fetch-proot.sh scripts/gen-release-notes.sh runtime/build-rootfs.sh \
                   app/src/main/assets/scripts/bootstrap.sh \
                   app/src/main/assets/scripts/pnpm-install.sh \
                   app/src/main/assets/scripts/mirror-apply.sh; do
            bash -n "$f"
          done

  android:
    name: Android 构建（arm64-v8a）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 21 跑 Gradle：AGP 新版 lint 内部分析依赖 JDK 21 的
      # SequencedCollection.removeLast()（JDK 17 下 lintDebug 硬崩，
      # 见 app/build.gradle.kts lint 块注释）；编译目标仍为 Java 17。
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # NDK/CMake 仅编译 libtermux.so（Termux pty JNI，见 app/src/main/cpp）
          packages: 'platforms;android-37.1 platform-tools ndk;27.2.12479018 cmake;3.22.1'
          accept-android-sdk-licenses: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 注入 proot 运行时资产
        run: ./scripts/fetch-proot.sh

      - name: 构建验证
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug

      - name: 上传调试 APK
        uses: actions/upload-artifact@v7
        with:
          name: dshm-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
