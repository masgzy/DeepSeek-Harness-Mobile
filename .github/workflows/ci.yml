# 代码质量门禁：脚本静态检查 + Android 构建验证
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell 脚本检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          shellcheck -S error \
            scripts/fetch-proot.sh \
            runtime/build-rootfs.sh \
            app/src/main/assets/scripts/bootstrap.sh
      - name: bash 语法检查
        run: |
          for f in scripts/fetch-proot.sh runtime/build-rootfs.sh \
                   app/src/main/assets/scripts/bootstrap.sh; do
            bash -n "$f"
          done

  android:
    name: Android 构建（arm64-v8a）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 platform-tools'
          accept-android-sdk-licenses: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 注入 proot 运行时资产
        run: ./scripts/fetch-proot.sh

      - name: 构建验证
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug

      - name: 上传调试 APK
        uses: actions/upload-artifact@v4
        with:
          name: dshm-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
